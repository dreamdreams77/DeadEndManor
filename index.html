async function endTurn(){
  const p=cur();
  const w=G.P.find(q=>vps(q)>=VPW);if(w)return endGame(w.id,`${w.name} reaches ${VPW} victory points and claims the manor!`);
  /* wings produce goods */
  if(p.car===4)p.res.wheat++;
  if(G.round%3===0){if(p.car===0&&p.lives<p.max)p.lives++;if(p.car===2){const c=investigate(p);if(c)say(`${p.name} the detective clears ${cl(p,c)}.`)}}
  ambChk(p);if(G.over)return;G.rolled=false;G.sugged=false;G.pk=false;G.arc=false;G.sug2=false;G.die=0;G.tab='T';
  if(G.turn===1){produce();moveCat();haunt();G.round++;G.dark=G.round>2&&rnd(5)===0;if(G.dark){say('The lights go out! Traps hit harder.');banner('LIGHTS OUT!')}if(G.round>MAXR)return endByScore()}
  G.turn=1-G.turn;
  if(cur().skip){cur().skip=0;say(`${cur().name} is tangled in cobwebs and loses a turn!`);render();await sleep(800);return endTurn()}
  say(`${cur().name}'s turn.`);G.hide=G.mode==2;render();banner(cur().name+"'s turn");
  if(G.mode==2){await modal(`<h2>${cur().name}</h2><p>Pass the device. Notebook is private, so look away, ${other().name}!</p>`);G.hide=false;render()}
  if(G.mode===1&&G.tut==null&&!cur().cpu&&G.round>1&&Math.random()<.3)await cpuOffer();
  if(cur().cpu)cpuTurn();
}
function score(p){const o=G.P[1-p.id];return p.cash+p.wings*5+p.lives*2+p.fam*3+p.stock*2+p.vp*2+(p.ambok?4:0)+p.rk*2+Object.keys(G.mnr).filter(i=>G.wings[i]===p.id).length*3+(lr(p)>=4&&lr(p)>lr(o)?4:0)+(p.kn>=2&&p.kn>o.kn?3:0)}
function endByScore(){
  const [a,b]=G.P;const sa=score(a),sb=score(b);
  const w=sa===sb?-1:sa>sb?0:1;
  endGame(w,`Fifteen rounds pass. Fortune: ${a.name} ${sa}, ${b.name} ${sb}. `+(w<0?'A tie!':`${G.P[w].name} inherits the manor.`));
}
async function endGame(w,why){
  G.over=true;LS('dem-save',null);meta(w);render();
  if(G.mode!==2&&w>=0){const r=W();r[w===(G.mode===3?G.me:0)?0:1]++;try{localStorage.dem=JSON.stringify(r)}catch(e){}}
  if(w>=0)setTimeout(confetti,60);
  sfx(w<0||G.mode===2||w===(G.mode===3?G.me:0)?'win':'lose');
  const t=w<0?'DRAW':`${G.P[w].name.toUpperCase()} WINS`;
  const sol=G.sol.map((v,c)=>CATS[c][1][v]).join(', ')+(G.acc2?' and '+SUS[G.sol2]+' (accomplice)':'');
  await modal(`<h2>${t}</h2><p>${why}</p><p>Truth: ${sol}.</p><p><button onclick="location.reload()">PLAY AGAIN</button></p>`);
}

/* ---------- CPU ---------- */
async function cpuTurn(){
  const p=cur();G.busy=true;render();await sleep(700);
  await roll();if(G.over)return;G.busy=true;
  while(G.fork!=null&&!G.over)doFork(p,Math.random()<(G.diff===2?.35:.5)?1:0);
  if(G.over)return;
  const step=async()=>{render();await sleep(650)};
  const D=DF[G.diff??1];
  if((solved(p)&&Math.random()<D.fin)||(D.gam&&G.round>=D.gr&&combos(p)<=D.cmb&&Math.random()<D.gam)){G.busy=false;return accuse(p,guess(p))}
  if(D.eco&&p.cash>=9&&Math.random()<.25){p.cash-=3;const o=G.P[1-p.id];for(let k=1;k<=3;k++){const i=(p.pos+k)%N;if(G.traps[i]===o.id){delete G.traps[i];delete G.tt[i];G.P.forEach(q=>q.seen.delete(i));say(`${p.name} disarms a trap ahead.`);break}}await step()}
  if(afford(p,COST.dev)&&Math.random()<D.dev){pay2(p,COST.dev);dev(p);await step()}
  if(afford(p,COST.road)&&G.roads[p.pos]===undefined&&Math.random()<D.road){pay2(p,COST.road);G.roads[p.pos]=p.id;say(`${p.name} lays a road.`);await step()}
  if(D.eco&&p.cash>=12&&p.rk<2){p.cash-=5;p.rk++;say(`${p.name} is promoted!`)}
  if(D.eco&&p.cash>=9&&!p.sh){p.cash-=4;p.sh=1}
  if(!G.arc&&Math.random()<.5){applyBonus(p,pick(['cash','goods']),1+rnd(2));await step()}
  if(D.eco&&p.cash>=9&&p.stock<2){p.cash-=4;p.stock++}
  if(total(p)>=1&&!p.known[2].has(Math.floor(p.pos/3))&&!solved(p)&&Math.random()<D.srch){pay(p,1);searchRoom(p);say(`${p.name} searches the ${ROOMN[Math.floor(p.pos/3)]}.`);await step()}
  if(!G.sugged&&!solved(p)&&Math.random()<D.sug){const u=[0,1].map(c=>pick(CATS[c][1].map((_,i)=>i).filter(i=>!p.known[c].has(i))));await doSuggest(p,u[0],u[1]);await step()}
  if(!G.pk&&p.cash>=5&&!solved(p)&&Math.random()<D.inv){G.pk=true;p.cash-=5;const c=investigate(p);if(c)say(`${p.name} bribes the maid.`);await step()}
  if(afford(p,COST.wing)&&G.wings[p.pos]===undefined&&!nearWing(p.pos)&&([5,6,8,9].includes(NUM(p.pos))||D.wing>.8)&&Math.random()<D.wing){act2(p,'wing');await step()}
  if(!G.pk&&total(p)>=2&&Math.random()<D.inv&&!solved(p)){G.pk=true;pay(p,2);const c=investigate(p);if(c)say(`${p.name} deduces ${c} is innocent.`);await step()}
  if(solved(p)){G.busy=false;return accuse(p,guess(p))}
  if(G.traps[p.pos]===undefined&&Math.random()<D.trap){const ts=TR.map((t,k)=>k).filter(k=>afford(p,TR[k].c));if(ts.length){doTrap(p,pick(ts));await step()}}
  if(G.wings[p.pos]===p.id&&!G.mnr[p.pos]&&afford(p,COST.manor)){pay2(p,COST.manor);G.mnr[p.pos]=1;say(`${p.name} upgrades a wing to a manor.`);await step()}
  G.busy=false;endTurn();
}
function act2(p,a){
  pay2(p,COST[a]);
  if(a==='wing'){G.wings[p.pos]=p.id;p.wings++;say(`${p.name} builds a wing in the ${room(p.pos)[0]}.`)}
  else{G.traps[p.pos]=p.id;say(`${p.name} sets a trap somewhere...`)}
}

reak 🔥. <b>Badges:</b> 8 to unlock.</li><li><b>Menu extras:</b> Tutorial (guided first game with coach tips), CPU level (Easy, Normal, Hard), Continue (solo and shared-screen games autosave every move), Install as App.</li><li><b>Online:</b> host shares a 4-letter code, friend joins with it.</li><li><b>Pawns:</b> pick a suspect with a perk (Penny pays no rent, Gus starts insured, Dot +$3, Rex has 4 lives, Lottie trades 2:1 at the bank, Moe peeks for 1 good). In online games each player picks a pawn (host first).</li><li><b>Life:</b> careers now include Chef (+1 wheat a turn) and Lawyer (+$1 on event tiles). Buy trap insurance ($4), buy shares ($4, up to 3, dividends each Hall pass, they can crash), and marry or have babies via events: family adds +$1 per pass.</li><li><b>Trap types:</b> Trapdoor 🕳️ (1 damage), Cobweb net 🕸️ (lose next turn), Chandelier 💡 (2 damage), Poison tea ☕ (1 damage and lose 2 goods). Insurance absorbs one.</li><li><b>Mittens the cat ($2):</b> sniffs the next 6 tiles and marks a rival trap in orange if she finds one.</li><li><b>Secret passages ◈:</b> landing on one slips you through to its twin tile.</li><li><b>Manor ♛ (⛏️⛏️🌾🌾):</b> upgrade your own wing. It produces 3 goods instead of 2 and is worth 3 points.</li><li><b>Arcade 🕹️ (Life tab, once a turn):</b> a random bonus game: Lockpick (win goods), Ghost Hunt (win cash), Memory (win a clue or cash) or Haunted Piano (win goods).</li><li><b>Search room (Clues tab, 1 good):</b> search the room you are standing in. If it is the murder room you find bloodstains and every other room is cleared in your notebook; otherwise that room is crossed off. Moving around the manor is part of the detective work.</li><li><b>Victory points:</b> wing 1, manor 2, VP card 1, longest road 2, largest army 2. The first to 8 wins outright. Wings cannot sit on neighbouring tiles. Number tokens show which production roll pays each tile (red 6 and 8 come up most). Road Building dev cards lay 2 free roads.</li><li><b>Clue and Catan extras:</b> suggest twice a turn (the second costs $2); suggesting in a room where you own a manor ♛ makes your rival reveal two cards. A wing on or beside your own road yields +1 on a production roll, and a 7 makes the robber lift a good from the blocked wing's owner. The CPU may offer you trades at the start of your turn. In your notebook, a category with one card left shows SOLVED in green.</li><li><b>Ambitions 🎯:</b> each player secretly draws one (Collector, Landlord, Survivor, Sleuth, Tycoon, Traveller). Fulfil it by the end of any of your turns for +2 victory points (+4 in the final fortune). Your rival only sees a ?. <b>Disarm ($3, Build tab):</b> removes a rival trap in the next 3 tiles.</li><li><b>Room perks:</b> the Library lets you search for free, the Ballroom pays $1 when you land on it, and the Kitchen gives +1 wheat when you land on your own wing there. Nine different ambitions can be drawn.</li><li><b>Score:</b> $ + 5 per wing + 2 per life + 3 per family member + 2 per share. A wrong accusation loses instantly.</li></ol>`)};
